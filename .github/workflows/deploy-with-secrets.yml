name: Deploy with 1Password Secrets and Tailscale

on:
  push:
    branches: [ main, claude/1password-cli-setup-o13olw ]
  pull_request:
    branches: [ main, claude/1password-cli-setup-o13olw ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Load secrets from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          # Export secrets for use in subsequent steps
          echo "DATABASE_URL=$(op read op://production/Database/connection-string)" >> $GITHUB_ENV
          echo "GITHUB_TOKEN_OP=$(op read op://production/GitHub/token)" >> $GITHUB_ENV
          echo "API_KEY=$(op read op://production/API/key)" >> $GITHUB_ENV
          echo "REGISTRY_CREDENTIALS=$(op read op://production/Docker/registry-credentials)" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          API_KEY: ${{ env.API_KEY }}
        run: npm test -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  build:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Load Docker registry credentials
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          # Get registry credentials from 1Password
          REGISTRY_USER=$(op read op://production/Docker/registry-username)
          REGISTRY_PASS=$(op read op://production/Docker/registry-password)
          echo "REGISTRY_USER=$REGISTRY_USER" >> $GITHUB_ENV
          echo "REGISTRY_PASSWORD=$REGISTRY_PASS" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.op
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Load deployment credentials
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          # Load deployment credentials
          DEPLOY_KEY=$(op read op://production/Deploy/ssh-key)
          DEPLOY_HOST=$(op read op://production/Deploy/host)
          DEPLOY_USER=$(op read op://production/Deploy/username)

          # Set up SSH
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "DEPLOY_HOST=$DEPLOY_HOST" >> $GITHUB_ENV
          echo "DEPLOY_USER=$DEPLOY_USER" >> $GITHUB_ENV

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to production
        env:
          SSH_KEY_PATH: ~/.ssh/deploy_key
          DEPLOY_HOST: ${{ env.DEPLOY_HOST }}
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
        run: |
          # SSH configuration
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -i $SSH_KEY_PATH \
              $DEPLOY_USER@$DEPLOY_HOST << 'EOF'

          # Pull latest code
          cd /app
          git pull origin main

          # Load secrets from 1Password
          source scripts/load-secrets.sh

          # Rebuild containers
          docker-compose -f docker-compose.op.yml build

          # Stop old containers
          docker-compose -f docker-compose.op.yml down

          # Start new containers
          docker-compose -f docker-compose.op.yml up -d

          # Verify health
          sleep 5
          curl http://localhost:3000/health || exit 1

          echo "Deployment successful"
          EOF

      - name: Verify deployment
        run: |
          # Get Tailscale IP of deployed service
          tailscale ip -4 > /tmp/tailscale_ip.txt
          TAILSCALE_IP=$(cat /tmp/tailscale_ip.txt)

          # Test API endpoint via Tailscale
          curl -f http://$DEPLOY_HOST:3000/health || exit 1

          echo "Deployment verified successfully"

      - name: Notify Slack on success
        if: success()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST $SLACK_WEBHOOK \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "✅ Production deployment successful",
              "attachments": [
                {
                  "color": "good",
                  "fields": [
                    {"title": "Repository", "value": "${{ github.repository }}", "short": true},
                    {"title": "Branch", "value": "${{ github.ref_name }}", "short": true},
                    {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                    {"title": "Author", "value": "${{ github.actor }}", "short": true}
                  ]
                }
              ]
            }'

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST $SLACK_WEBHOOK \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "❌ Production deployment failed",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    {"title": "Repository", "value": "${{ github.repository }}", "short": true},
                    {"title": "Branch", "value": "${{ github.ref_name }}", "short": true},
                    {"title": "Workflow", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": true}
                  ]
                }
              ]
            }'

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run npm audit
        run: npm audit --json > npm-audit.json || true

      - name: Upload npm audit results
        uses: actions/upload-artifact@v3
        with:
          name: npm-audit
          path: npm-audit.json
